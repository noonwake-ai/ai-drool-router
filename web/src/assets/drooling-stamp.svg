<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img"
     aria-label="Drooling stamp">
  <!-- Original artwork drawn for this project. No third-party asset. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f2f0"/>
      <stop offset="1" stop-color="#d8d8d4"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3c"/>
      <stop offset="1" stop-color="#1d1d1f"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="116" height="116" rx="10" fill="url(#paper)"
        stroke="#9a9a96" stroke-width="2"/>
  <rect x="6" y="6" width="108" height="108" rx="8" fill="none"
        stroke="#b9b9b4" stroke-width="1"/>

  <!-- head -->
  <path d="M28 62c0-22 14-36 32-36s32 14 32 36c0 20-13 32-32 32S28 82 28 62z"
        fill="url(#ink)"/>

  <!-- eyes: wide, blank stare -->
  <ellipse cx="48" cy="58" rx="8.5" ry="9.5" fill="#f4f4f2"/>
  <ellipse cx="72" cy="58" rx="8.5" ry="9.5" fill="#f4f4f2"/>
  <circle cx="49.5" cy="60" r="3.6" fill="#1b1b1d"/>
  <circle cx="73.5" cy="60" r="3.6" fill="#1b1b1d"/>
  <circle cx="47.6" cy="57.4" r="1.2" fill="#fff"/>
  <circle cx="71.6" cy="57.4" r="1.2" fill="#fff"/>

  <!-- slack mouth -->
  <path d="M50 76c3-3 17-3 20 0-1 7-19 7-20 0z" fill="#e8e8e4"/>
  <path d="M50 76c3-3 17-3 20 0" fill="none" stroke="#0d0d0f" stroke-width="1.6"/>

  <!-- the drool -->
  <path d="M60 82c1.5 6-1 9-.4 13.5.5 3.6 2.4 4.6 3.6 8.2"
        fill="none" stroke="#fbfbf8" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="64.4" cy="107" r="3.4" fill="#fbfbf8"/>

  <!-- stamp grit -->
  <g fill="#ffffff" opacity="0.14">
    <circle cx="22" cy="30" r="1.6"/><circle cx="98" cy="26" r="2"/>
    <circle cx="30" cy="96" r="1.8"/><circle cx="94" cy="92" r="1.5"/>
    <circle cx="18" cy="70" r="1.2"/><circle cx="103" cy="64" r="1.3"/>
  </g>
</svg>
