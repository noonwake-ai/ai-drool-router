<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9aa3"/></marker><marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#00c895"/></marker><marker id="agold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d5b769"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a1f"/><stop offset="1" stop-color="#141417"/></linearGradient></defs><rect x="0.0" y="0.0" width="1200.0" height="380.0" rx="0" fill="url(#bg)"/><text x="60.0" y="54.0" font-size="30" fill="#f0f0f2" font-weight="650" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">Three processes, one credential boundary</text><rect x="60.0" y="96.0" width="260.0" height="210.0" rx="14" fill="#1c1c21" stroke="#33333b" stroke-width="1"/><rect x="60.0" y="112.0" width="3.0" height="178.0" rx="1.5" fill="#d5b769"/><text x="84.0" y="140.0" font-size="18" fill="#f0f0f2" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">worker</text><text x="84.0" y="172.0" font-size="13" fill="#9a9aa3" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">pull accounts, probe, score</text><text x="84.0" y="196.0" font-size="13" fill="#9a9aa3" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">write priority back on demand</text><rect x="84.0" y="262.0" width="153.1" height="26.0" rx="13" fill="#222228" stroke="#00c895" stroke-width="1"/><text x="96.0" y="279.0" font-size="12" fill="#00c895" font-weight="550" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">holds the Sub2API key</text><rect x="470.0" y="96.0" width="260.0" height="210.0" rx="14" fill="#1c1c21" stroke="#33333b" stroke-width="1"/><rect x="470.0" y="112.0" width="3.0" height="178.0" rx="1.5" fill="#32b8df"/><text x="494.0" y="140.0" font-size="18" fill="#f0f0f2" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">data dir</text><text x="494.0" y="172.0" font-size="13" fill="#9a9aa3" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">private/ the real database</text><text x="494.0" y="196.0" font-size="13" fill="#9a9aa3" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">public/ redacted projection</text><rect x="880.0" y="96.0" width="260.0" height="210.0" rx="14" fill="#1c1c21" stroke="#33333b" stroke-width="1"/><rect x="880.0" y="112.0" width="3.0" height="178.0" rx="1.5" fill="#00c895"/><text x="904.0" y="140.0" font-size="18" fill="#f0f0f2" font-weight="600" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">web</text><text x="904.0" y="172.0" font-size="13" fill="#9a9aa3" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">reads the public projection</text><text x="904.0" y="196.0" font-size="13" fill="#9a9aa3" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">serves the browser</text><rect x="904.0" y="262.0" width="129.8" height="26.0" rx="13" fill="#222228" stroke="#ff4c5d" stroke-width="1"/><text x="916.0" y="279.0" font-size="12" fill="#ff4c5d" font-weight="550" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">cannot see any key</text><line x1="328.0" y1="201.0" x2="462.0" y2="201.0" stroke="#9a9aa3" stroke-width="2" fill="none" marker-end="url(#a)"/><line x1="738.0" y1="201.0" x2="872.0" y2="201.0" stroke="#9a9aa3" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="60.0" y="350.0" font-size="14" fill="#6b6b76" font-weight="400" font-family="system-ui,-apple-system,Segoe UI,Roboto,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif">The browser never receives an upstream key, and the web process is blocked from the private database and the credential file.</text></svg>
